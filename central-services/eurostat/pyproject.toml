[project]
name = "relife-eurostat"
version = "0.1.0"
description = "Ingestion job that syncs Eurostat datasets into the ReLIFE central Supabase"
readme = "README.md"
authors = [
    { name = "Andres Garcia Mangas", email = "andres.garcia@fundacionctic.org" },
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "supabase==2.17.0",
]

[project.scripts]
relife-eurostat = "relife_eurostat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["black>=25.1.0", "isort>=6.0.1", "mypy>=1.15.0", "pytest>=8.3.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/relife_eurostat"]

[tool.isort]
profile = "black"

[tool.mypy]
strict = true
